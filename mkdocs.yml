site_name: JSON:API for Java
site_description: Versioned documentation for the Core library and Spring integration.
site_url: https://jsonapi.kazforge.com/
repo_url: https://github.com/kazforge
repo_name: kazforge
strict: true
use_directory_urls: true
theme:
  name: material
  custom_dir: overrides
  logo: assets/images/favicon.png
  favicon: assets/images/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    anchors: warn
    not_found: warn
    unrecognized_links: warn
extra_css:
  - assets/stylesheets/extra.css
extra:
  products:
    core:
      title: Core
      repo: kazforge/jsonapi-java
    spring:
      title: Spring
      repo: kazforge/jsonapi-java-spring
copyright: Maintained by KazForge
