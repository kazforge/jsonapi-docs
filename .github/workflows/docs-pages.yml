name: Documentation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Set these only in a reviewed release-promotion PR, after publication and
# consumer verification. SHA means the full software-tag commit, never main.
env:
  CORE_VERSION: ''
  CORE_SHA: ''
  SPRING_VERSION: ''
  SPRING_SHA: ''
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Documentation required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out approved Core release
        if: env.CORE_SHA != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kazforge/jsonapi-java
          ref: ${{ env.CORE_SHA }}
          path: _sources/core
          persist-credentials: false
      - name: Copy Core documentation
        if: env.CORE_SHA != ''
        run: |
          mkdir -p "docs/core/$CORE_VERSION"
          cp -R _sources/core/docs/site/. "docs/core/$CORE_VERSION/"
      - name: Check out approved Spring release
        if: env.SPRING_SHA != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kazforge/jsonapi-java-spring
          ref: ${{ env.SPRING_SHA }}
          path: _sources/spring
          persist-credentials: false
      - name: Copy Spring documentation
        if: env.SPRING_SHA != ''
        run: |
          mkdir -p "docs/spring/$SPRING_VERSION"
          cp -R _sources/spring/docs/site/. "docs/spring/$SPRING_VERSION/"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Install MkDocs
        run: |
          python -m pip install --only-binary :all: --require-hashes -r requirements.txt
      - run: mkdocs build --strict
      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-preview
          path: site
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
